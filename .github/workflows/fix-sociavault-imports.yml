name: Fix SociaVault Imports

on:
  push:
    paths:
      - '.github/workflows/fix-sociavault-imports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair SociaVault parsing and add scanner fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/services/sociavault.py')
          s = p.read_text()
          old = '''    payload = resp.json()\n    if isinstance(payload, dict) and payload.get("success") is False:\n        raise RuntimeError(str(payload.get("message") or payload.get("error") or "SociaVault request failed."))\n    data = payload.get("data", payload) if isinstance(payload, dict) else None\n    if not isinstance(data, dict):\n        raise RuntimeError("SociaVault returned no product data.")\n    return data\n'''
          new = '''    payload = resp.json()\n    if not isinstance(payload, dict):\n        raise RuntimeError("SociaVault returned no product data.")\n\n    def fail_if_unsuccessful(node):\n        if isinstance(node, dict) and node.get("success") is False:\n            raise RuntimeError(str(node.get("message") or node.get("error") or "SociaVault request failed."))\n\n    fail_if_unsuccessful(payload)\n    data = payload.get("data", payload)\n    # SociaVault sometimes wraps the scraper result in an additional data envelope.\n    for _ in range(3):\n        if not isinstance(data, dict):\n            break\n        fail_if_unsuccessful(data)\n        nested = data.get("data")\n        if isinstance(nested, dict) and not any(k in data for k in ("product_base", "product", "product_id", "product_detail_review")):\n            data = nested\n            continue\n        break\n    if not isinstance(data, dict):\n        raise RuntimeError("SociaVault returned no product data.")\n    return data\n'''
          if old not in s:
              raise SystemExit('sociavault_get block not found')
          s = s.replace(old, new, 1)

          old2 = '''    if not listing:\n        listing = sv_collect_urls(raw_images or product)[:18]\n    listing = dedupe([normalize_remote_url(u) for u in listing if normalize_remote_url(u)])[:18]\n'''
          new2 = '''    if not listing:\n        listing = sv_collect_urls(raw_images or product)[:18]\n    # Last-resort parser for response-shape changes: scan the returned product payload,\n    # while sv_collect_urls still filters avatars/seller/shop UI imagery.\n    if not listing:\n        listing = sv_collect_urls(data)[:18]\n    listing = dedupe([normalize_remote_url(u) for u in listing if normalize_remote_url(u)])[:18]\n'''
          if old2 not in s:
              raise SystemExit('listing fallback block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          t = Path('backend/tasks.py')
          x = t.read_text()
          old3 = '''    else:\n        data = sociavault.import_product(job.product_url, region=region)\n'''
          new3 = '''    else:\n        try:\n            data = sociavault.import_product(job.product_url, region=region)\n        except Exception as sociavault_exc:\n            # Scanner/Momentum already has a cover image. Use it as a safety net when\n            # SociaVault returns HTTP 200 but no usable gallery due to an upstream shape/scrape issue.\n            scanner_name = str(job.product_name or "Unknown Product").strip() or "Unknown Product"\n            scanner_images = [str(x) for x in _as_list(job.listing_images) if str(x).strip()]\n            if job.scanner_row_num and not scanner_images:\n                scanner_rec, _scanner_error = sheets.scanner_row(int(job.scanner_row_num))\n                if scanner_rec:\n                    scanner_name = str(scanner_rec.get("Product Name") or scanner_name).strip() or scanner_name\n                    scanner_image = sociavault.normalize_remote_url(scanner_rec.get("Product Image"))\n                    if scanner_image:\n                        scanner_images = [scanner_image]\n            if not scanner_images:\n                raise RuntimeError(str(sociavault_exc))\n            product_id = str(job.product_id or "").strip() or hashlib.sha1(str(job.product_url).encode("utf-8")).hexdigest()[:20]\n            data = {\n                "product_id": product_id,\n                "product_name": scanner_name,\n                "sociavault_region": region,\n                "listing_images": scanner_images[:18],\n                "review_images": [],\n                "selected_refs": scanner_images[: settings().max_product_refs],\n                "focus": sociavault.classify_focus(scanner_name),\n                "provider": "scanner_fallback",\n            }\n'''
          if old3 not in x:
              raise SystemExit('US import block not found')
          x = x.replace(old3, new3, 1)
          t.write_text(x)
          PY
      - name: Syntax check
        run: python -m py_compile backend/services/sociavault.py backend/tasks.py
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-sociavault-imports.yml
          git add backend/services/sociavault.py backend/tasks.py
          git commit -m 'Fix SociaVault product image imports'
          git push origin main
