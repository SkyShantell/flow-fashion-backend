name: Fix Worker Queue Priority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-worker-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prioritize production tasks over imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/tasks.py")
          text = p.read_text()

          old_import = "from sqlalchemy import and_, or_"
          new_import = "from sqlalchemy import and_, case, or_"
          if text.count(old_import) != 1:
              raise SystemExit(f"unexpected sqlalchemy import count: {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_order = ".order_by(QueueTask.priority.asc(), QueueTask.created_at.asc())"
          new_order = '''.order_by(
              case((QueueTask.task_type == "import_product", 1), else_=0).asc(),
              QueueTask.priority.asc(),
              QueueTask.created_at.asc(),
          )'''
          if text.count(old_order) != 1:
              raise SystemExit(f"unexpected queue order count: {text.count(old_order)}")
          text = text.replace(old_order, new_order, 1)
          p.write_text(text)
          PY

      - name: Syntax check
        run: python -m py_compile backend/tasks.py

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tasks.py
          git rm .github/workflows/fix-worker-priority.yml
          git commit -m "Prioritize production tasks over imports"
          git push origin HEAD:main
