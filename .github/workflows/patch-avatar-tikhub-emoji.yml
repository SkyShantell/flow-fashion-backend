name: Patch Avatar TikHub Emoji

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-avatar-tikhub-emoji.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch backend
        run: |
          python .github/scripts/patch_avatar_tikhub_emoji.py
          python -m compileall -q backend
          git diff --check
      - name: Commit backend patch
        run: |
          git config user.name "SkyShantell"
          git config user.email "168357390+SkyShantell@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No backend changes"
          else
            git commit -m "Externalize avatars and harden UK imports"
            git push origin main
          fi
