name: Patch TikHub UK Import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-tikhub-uk-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Route UK imports through TikHub
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks = Path("backend/tasks.py")
          text = tasks.read_text()

          old_import = "from backend.services import drive, editorial, sheets, sociavault, useapi"
          new_import = "from backend.services import drive, editorial, sheets, sociavault, tikhub, useapi"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit("Could not locate tasks provider import")

          start_marker = '    data = None\n    if region == "GB" and job.scanner_row_num:'
          end_marker = '    job.sociavault_region = str(data.get("sociavault_region") or region)'
          if start_marker in text:
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit("Could not locate end of old UK fallback block")
              replacement = '    if region == "GB":\n        data = tikhub.import_product(job.product_url, region="GB")\n    else:\n        data = sociavault.import_product(job.product_url, region=region)\n\n'
              text = text[:start] + replacement + text[end:]
          elif 'data = tikhub.import_product(job.product_url, region="GB")' not in text:
              raise SystemExit("Could not locate old or new UK import block")

          tasks.write_text(text)
          PY

      - name: Syntax check
        run: python -m py_compile backend/config.py backend/services/tikhub.py backend/tasks.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- backend/tasks.py; then
            echo "No tasks.py changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tasks.py
          git commit -m "Route UK TikTok Shop imports through TikHub"
          git push origin HEAD:main
