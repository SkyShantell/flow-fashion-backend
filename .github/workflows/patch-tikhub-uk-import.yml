name: Patch TikHub UK Import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-tikhub-uk-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Route UK imports through TikHub
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks = Path("backend/tasks.py")
          text = tasks.read_text()

          old_import = "from backend.services import drive, editorial, sheets, sociavault, useapi"
          new_import = "from backend.services import drive, editorial, sheets, sociavault, tikhub, useapi"
          if text.count(old_import) != 1:
              raise SystemExit(f"Expected tasks import once, found {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_block = '''    data = None
    if region == "GB" and job.scanner_row_num:
        scanner_rec, scanner_error = sheets.scanner_row(job.scanner_row_num)
        if scanner_rec:
            product_image = sociavault.normalize_remote_url(scanner_rec.get("Product Image"))
            product_name = str(scanner_rec.get("Product Name") or job.product_name or "Unknown Product").strip()
            if product_image:
                data = {
                    "product_id": job.product_id or hashlib.sha1(job.product_url.encode()).hexdigest()[:12],
                    "product_name": product_name,
                    "sociavault_region": "GB",
                    "listing_images": [product_image],
                    "review_images": [],
                    "selected_refs": [product_image],
                    "focus": sociavault.classify_focus(product_name),
                }

    if data is None:
        if region == "GB":
            raise RuntimeError(
                "UK TikTok Shop is not supported by SociaVault yet. For UK products, import from the Creator Scanner or Momentum Sniper queue so Flow Fashion can use the product data/image already captured there."
            )
        data = sociavault.import_product(job.product_url, region=region)
'''
          new_block = '''    if region == "GB":
        data = tikhub.import_product(job.product_url, region="GB")
    else:
        data = sociavault.import_product(job.product_url, region=region)
'''
          if text.count(old_block) != 1:
              raise SystemExit(f"Expected old UK fallback block once, found {text.count(old_block)}")
          text = text.replace(old_block, new_block, 1)
          tasks.write_text(text)

          main = Path("backend/main.py")
          m = main.read_text()
          old_health = '        "sociavault": bool(cfg.sociavault_api_key),\n        "google_sheet":'
          new_health = '        "sociavault": bool(cfg.sociavault_api_key),\n        "tikhub": bool(cfg.tikhub_api_key),\n        "google_sheet":'
          if m.count(old_health) != 1:
              raise SystemExit(f"Expected health block once, found {m.count(old_health)}")
          main.write_text(m.replace(old_health, new_health, 1))
          PY

      - name: Syntax check
        run: python -m py_compile backend/config.py backend/services/tikhub.py backend/tasks.py backend/main.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tasks.py backend/main.py
          git commit -m "Route UK TikTok Shop imports through TikHub"
          git push origin HEAD:main
